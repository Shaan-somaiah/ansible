---

- name: Check active kernel cmdline
  ansible.builtin.command:
    cmd: cat /proc/cmdline
  register: cmdline_before
  changed_when: false

- name: Print active kernel cmdline
  ansible.builtin.debug:
    msg: "{{ cmdline_before.stdout }}"

- name: Check if memory cgroup parameters are already active
  ansible.builtin.set_fact:
    memory_cgroup_enabled: >-
      {{
        'cgroup_enable=memory' in cmdline_before.stdout and
        'cgroup_memory=1' in cmdline_before.stdout
      }}

- name: Append memory cgroup parameters
  ansible.builtin.shell: |
    sed -i '$ s/$/ cgroup_enable=memory cgroup_memory=1/' /boot/firmware/cmdline.txt
  args:
    executable: /bin/bash
  when: not memory_cgroup_enabled

- name: Reboot and wait for system
  ansible.builtin.reboot:
  when: not memory_cgroup_enabled

- name: Check active kernel cmdline after reboot
  ansible.builtin.command:
    cmd: cat /proc/cmdline
  register: cmdline_after
  changed_when: false

- name: Print active kernel cmdline after reboot
  ansible.builtin.debug:
    msg: "{{ cmdline_after.stdout }}"

- name: Check if Kubernetes is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_initialized

- name: Stop kubelet if kubeadm needs to run
  systemd:
    name: kubelet
    state: stopped
  when: not kubeadm_initialized.stat.exists

- name: Initialize Kubernetes control plane
  command: >
    kubeadm init
    --apiserver-advertise-address={{ api_server_ip }}
    --pod-network-cidr={{ pod_network_cidr }}
  when: not kubeadm_initialized.stat.exists

- name: Wait for API server
  wait_for:
    host: "{{ api_server_ip }}"
    port: 6443
    timeout: 120

- name: Create kubeconfig directory
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy admin.conf
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Install Flannel
  command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ flannel_manifest }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for Flannel rollout
  command:
    argv:
      - kubectl
      - rollout
      - status
      - daemonset/kube-flannel-ds
      - -n
      - kube-flannel
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel
  retries: 30
  delay: 10
  until: flannel.rc == 0

- name: Wait until control plane node is Ready
  command:
    argv:
      - kubectl
      - get
      - nodes
      - --no-headers
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: nodes
  retries: 30
  delay: 5
  until: >
    nodes.stdout_lines |
    select('search', ' Ready ') |
    list |
    length > 0

- name: Install Metrics Server
  command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ metrics_server_manifest }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Enable insecure kubelet TLS for Metrics Server
  command: >
    kubectl patch deployment metrics-server
    -n kube-system
    --type=json
    -p='[
      {
        "op":"add",
        "path":"/spec/template/spec/containers/0/args/-",
        "value":"--kubelet-insecure-tls"
      }
    ]'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
