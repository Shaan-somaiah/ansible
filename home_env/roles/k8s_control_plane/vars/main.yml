---
pod_network_cidr: "10.244.0.0/16"

flannel_manifest: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"

metrics_server_manifest: "https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml"

flannel_manifest_local: "/tmp/flannel.yaml"

api_server_ip: >-
  {{
    ansible_facts['eth0.30']['ipv4']['address']
    if 'eth0.30' in ansible_facts
    else ansible_facts.default_ipv4.address
  }}
