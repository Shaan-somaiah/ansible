---
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.07.2
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
      - "8443:443/tcp"
    environment:
      TZ: 'Asia/Calcutta'
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_dns_upstreams: '172.25.100.7'
    volumes:
      - './etc-pihole:/etc/pihole'
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped
    networks:
      - dns_net

  bind:
    container_name: bind9
    image: ubuntu/bind9:9.20-26.04_stable
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
    volumes:
      - ./bind:/etc/bind
    restart: unless-stopped
    networks:
      dns_net:
        ipv4_address: 172.25.100.7

networks:
  dns_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.100.0/24
