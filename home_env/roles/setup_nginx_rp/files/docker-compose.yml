services:
  nginx:
    image: nginx:stable
    container_name: nginx-proxy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    dns:
      - 172.25.100.8

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro

    networks:
      - default
      - dns_net

networks:
  dns_net:
    external: true
    name: dns_dns_net